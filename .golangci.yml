# golangci-lint v2 configuration. Validate with: golangci-lint config verify
#
# The same linter set as the plugin contract and the server. The dependency rule
# is this plugin's own: it reads the contract, the protocol's wire types for the
# documents it decodes, and its own database driver, and nothing from the
# server. A plugin that imported the server would be one the server has to be
# rebuilt for.
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  show-stats: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - govet
    - ineffassign
    - intrange
    - nilerr
    - nolintlint
    - paralleltest
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - thelper
    - unparam
    - unused
    - wrapcheck

  settings:
    depguard:
      rules:
        # The plugin: the standard library, the contract, the protocol's wire
        # types, its own packages and its database driver. Nothing from the
        # server, ever.
        a-plugin-and-not-the-server:
          list-mode: strict
          files:
            - "!$test"
          allow:
            - $gostd
            - github.com/pacenote-sim/engineer
            - github.com/pacenote-sim/plugin
            - github.com/pacenote-sim/protocol
            - github.com/jackc/pgx
        tests-use-testing-deps-only:
          list-mode: strict
          files:
            - "**_test.go"
          allow:
            - $gostd
            - github.com/pacenote-sim/engineer
            - github.com/pacenote-sim/plugin
            - github.com/pacenote-sim/protocol
            - github.com/jackc/pgx
            - github.com/stretchr/testify
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - unnamedResult
        - hugeParam
    gosec:
      excludes:
        - G104 # duplicates errcheck
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    paralleltest:
      ignore-missing: false
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
        - -ST1000 # package comments are checked by revive
    testifylint:
      enable-all: true
    thelper:
      test:
        first: true
        name: true
        begin: true
    unparam:
      check-exported: false
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - errors.Unwrap(

  exclusions:
    generated: lax
    warn-unused: false
    rules:
      # wrapcheck guards a boundary this plugin mostly does not have: an error
      # is either the contract's sentinel, meant to travel as it is, or is
      # already wrapped with what this plugin was doing.
      - path: .
        linters:
          - wrapcheck
      - path: _test\.go
        linters:
          - gosec
      # A route answers with a status, never with an error. A report that
      # cannot be read is the caller's 400, a database that will not answer is
      # a 502 the page explains; returning the error instead would have the
      # host answer a bare gateway error for both. nilerr sees "err != nil,
      # return nil" and cannot know that the response is the error.
      - path: (cues|http|profile)\.go
        linters:
          - nilerr

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/pacenote-sim/engineer
      extra-rules: false
    goimports:
      local-prefixes:
        - github.com/pacenote-sim/engineer

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
